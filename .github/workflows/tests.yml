name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  router:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04 since 2026-10-19 and has no Python 3.9 build;
        # 24.04 still does, so the minimum supported version stays tested.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Without PyYAML the router uses its own reader; with it, the tests check
      # that both read the shipped files the same way.
      - name: Unit tests (built-in YAML reader)
        run: python -m unittest discover -s tests -v
      - name: Unit tests (against PyYAML)
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s tests -v
      - name: Dry run without a model call
        run: python skills/right-size/scripts/route.py --dry-run --tier standard "smoke test"
