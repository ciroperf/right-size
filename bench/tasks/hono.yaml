# Benchmark v0 tasks: real honojs/hono PRs merged after 2026-07-01, i.e. after
# the training cutoff of the models under test, so the fixes can't be recalled.
#
# For each task the runner checks out `solution^` (the commit before the
# squash-merged PR), gives the agent `prompt`, then copies the PR's test files
# from `solution` and runs them. The task counts as solved when they pass.
#
# Prompts describe the observable bug, as an issue would. They never point to
# the fix itself. `expected_tier` is the author's label, used only for analysis;
# the agent never sees it.

repo: https://github.com/honojs/hono
install_cmd: npx -y bun@1.2.20 install --frozen-lockfile   # every task predates Hono's move to pnpm
test_cmd: npx vitest --run {test_files}

tasks:
  - id: compress-206
    pr: 5020
    solution: 67efb27f7bcba7a99cae7779b7eb71c3fcada8d8
    expected_tier: mechanical
    prompt: |
      The compress middleware gzips 206 Partial Content responses. The
      Content-Range header still describes the uncompressed byte range, and the
      original Content-Length is dropped, so clients that stitch ranges together
      get corrupted data. A 206 response should be passed through uncompressed.

  - id: csrf-options
    pr: 5250
    solution: eea9735fe308e6549509c312d80e13cd9e18898b
    expected_tier: deep
    prompt: |
      The csrf middleware rejects OPTIONS requests (for example CORS preflight)
      when the Origin doesn't match. RFC 9110 defines OPTIONS as a safe method,
      like GET and HEAD, so it should not be subject to CSRF validation.

  - id: jwt-bad-signature
    pr: 5379
    solution: 52febbcc30bc509d5e4987577e63906fe08fc471
    expected_tier: deep
    prompt: |
      JWT verification throws a raw DOMException (InvalidCharacterError) when the
      token's signature part contains characters outside the base64url alphabet,
      e.g. `header.payload.@@@@`. It should reject with Hono's JwtTokenInvalid
      error, like any other malformed token.

  - id: etag-ows
    pr: 5222
    solution: f8b7847d755d98009feb2d7d1e6dff0921f8c500
    expected_tier: mechanical
    prompt: |
      The etag middleware returns 200 with the full body instead of 304 when the
      If-None-Match header has whitespace before a comma, e.g. `"a" , "b"`, even
      though the current ETag is in the list. RFC 9110 allows optional whitespace
      on both sides of the list delimiter.

  - id: accepts-case
    pr: 5376
    solution: f5a53463ad2ff791fc02418b645750ce75a260ad
    expected_tier: standard
    prompt: |
      The `accepts()` helper matches case-sensitively. With supports ['text/html'],
      `Accept: TEXT/HTML` returns the default instead of text/html, and with
      supports ['en-US'], `Accept-Language: en-us` returns the default too.
      `TEXT/*` doesn't match text/html either. Media types (RFC 9110 §8.3.1) and
      language tags (RFC 4647 §2.1) are case-insensitive. The matched value
      returned should keep the casing the application registered in `supports`.

  - id: secure-headers-csp
    pr: 5147
    solution: 402eb3abe561914f41ee0f8e37f1d7f211f1ee51
    expected_tier: deep
    prompt: |
      In the secure-headers middleware, using a nonce in one CSP mode breaks when
      both `contentSecurityPolicy` and `contentSecurityPolicyReportOnly` are set:
      for example a static enforced policy plus a report-only policy that uses a
      nonce. The request ends in a 500 response. Each policy should work
      independently, including when both use nonces.

  - id: trie-suffix-wildcard
    pr: 5236
    solution: 63bbcf508c74d9fe7a3e20f4dfe7ffacc566dcce
    expected_tier: deep
    # Corrected 2026-10-21 (v1-results branch): the PR's tests also check that regex
    # characters in the prefix are literal and that registration order doesn't matter.
    # Sonnet and the router failed exactly those two tests in the checks run.
    prompt: |
      With the TrieRouter, suffix wildcard routes like `/assets*` return 404 for
      `/assets/app.js` when a mounted sub-app registers a static route and a
      `:param` route as siblings with the same method. For example: sub.post('/items'),
      sub.post('/:slug'), app.route('/api', sub), then app.get('/assets*', ...).
      `/assets/*` (slash-star) is unaffected. A suffix wildcard should match
      regardless of what else is registered; the prefix before `*` is literal,
      including regular expression characters (`/file.+*` matches `/file.+js`,
      not `/fileZZjs`). Registration order must not matter either: `/assets*`
      must still match when a longer route such as `/assets*/x` was added first.

  # Larger tasks (added for v0.1): multi-file or long-reasoning changes, where
  # delegating to a cheaper model has room to pay off.

  - id: etag-stream-digest
    pr: 5205
    solution: 26de73133b8552f56ba72e025ecd82b08900d796
    expected_tier: standard
    prompt: |
      The etag middleware produces different ETags for the same streamed body
      depending on how the ReadableStream is chunked. A response streaming 1,000,000
      zero bytes in one chunk gets a different ETag from the same 1,000,000 bytes
      sent as chunks of 1, 32,768 and 967,231 bytes. The ETag should depend only on
      the bytes of the body, not on chunk boundaries.

  - id: content-type-case
    pr: 5067
    solution: b20d4225c9aa9e615717ca74e437852cc9fd5b94
    expected_tier: standard
    prompt: |
      `parseBody()` and `validator()` match Content-Type media types case-sensitively.
      A request with `Content-Type: Application/JSON` or
      `Application/X-WWW-Form-Urlencoded` is parsed fine by the platform Request,
      but Hono's checks skip it and pass an empty object downstream. Media types are
      case-insensitive (RFC 9110), so these requests should be parsed and validated
      like their lower-case equivalents.

  - id: accepts-wildcard
    pr: 5255
    solution: 28a9c128912de19f3fb28b00ae289c9b93f6f392
    expected_tier: standard
    # v0 prompt said `*/*` should match supported types, which the PR's tests reject
    # (it falls through to the default). Corrected 2026-10-17; all three configs rerun.
    prompt: |
      The `accepts()` helper's default matcher ignores subtype wildcards sent by
      clients. With supports ['application/json', 'text/html'], `Accept: application/*`
      falls back to the default instead of returning application/json. A subtype
      wildcard (`type/*`) should match a supported type of that type. At the same
      quality value an exact match takes precedence over a wildcard match. The global
      wildcards `*/*` and `*` keep their current behavior: they fall through to the
      configured default rather than picking a supported value.

  # Hard tasks (added for v1): larger or subtler changes, picked so that a
  # cheaper model has a real chance to fail and escalation gets exercised.

  - id: regexp-router-unsupported
    pr: 5171
    solution: 8a0b18fd
    expected_tier: deep
    # v1 prompt left out two fixes the PR's tests also check (single meta-character
    # pattern, middle-wildcard param capture); every config failed exactly those two
    # tests. Corrected 2026-10-21.
    prompt: |
      Unlike the other routers, `RegExpRouter` only throws `UnsupportedPathError`
      when the matcher is built by the first `match()` call, not when the
      unsupported route is added. Make it report unsupported paths during route
      registration (`add()`), like the other routers, for example when an ALL route
      and a specific-method route conflict in either registration order. A param
      whose pattern is a single regexp meta character, such as `/:x{.}`, is also
      unsupported. Routing results, route ordering, method inheritance and the
      matcher format used by `PreparedRegExpRouter` must not change.

      While there, fix a related bug: after `add('GET', '/w/*/x', ...)` and
      `add('GET', '/w/:id/y', ...)`, matching `/w/123/y` finds the second route but
      doesn't capture `id`.

  - id: jsx-array
    pr: 5179
    solution: 3feb3551
    expected_tier: standard
    # v1 prompt left out callback preservation and context isolation, which the PR's
    # tests check; every config failed them. Corrected 2026-10-21.
    prompt: |
      In `hono/jsx`, a function component that returns an array (for example
      `const Items = () => [<li>a</li>, <li>b</li>]`) doesn't render correctly,
      although `hono/jsx/dom` already allows it. A function component should be
      able to return an array, including nested arrays, arrays containing async
      components, and async components that return arrays. Strings in the array
      are escaped as usual. It must work in string rendering, streaming and the
      jsx-renderer middleware, and a component typed as `FC` must be allowed to
      return an array.

      Escaped-string callbacks carried by array items must survive, in string
      rendering and in streaming, so that for example a `<title>` returned in an
      async component's array is still hoisted into `<head>`. Also, when the same
      promise of an element is rendered under two different context providers at
      once, each render must see its own provider's value.

  - id: method-not-allowed
    pr: 5132
    solution: 1f707c56
    expected_tier: standard
    # v1 prompt left out the callback's second argument and the stale-header rule that
    # the PR's tests check; every config failed those two tests. Corrected 2026-10-21.
    # Second correction the same day: the first one said to drop every 404 header,
    # which contradicts the test that keeps downstream headers, and "sub-apps" did not
    # say the middleware may be installed inside a mounted sub-app with a basePath.
    # Every config failed those two tests again.
    prompt: |
      Add an opt-in middleware at `src/middleware/method-not-allowed/index.ts`,
      exported as `methodNotAllowed`. Called as `methodNotAllowed({ app,
      onMethodNotAllowed? })`, it turns a 404 into `405 Method Not Allowed` (body
      `Method Not Allowed`, empty for HEAD) with an `Allow` header listing every
      method the path is registered for, in registration order and without
      duplicates, when the path exists for other methods. GET routes also allow HEAD;
      `ALL` routes are not counted, and explicit `HEAD` routes are not advertised
      because Hono never dispatches them. Requests for an allowed method, paths that
      don't exist at all, an intentional 404 from a handler matched for the request
      method, a 404 produced by the error handler, and a non-404 not-found response
      are untouched. The 405 replaces the not-found response's representation
      headers (a stale `Allow` or `Content-Length` must not survive), but headers
      that inner middleware adds after `next()` are kept, and outer middleware must
      see the final 405 status. Assign the response to `c.res` rather than throwing,
      so the error handler is not invoked. `onMethodNotAllowed(c, allowedMethods)`
      (the same method list, as an array) replaces the default response. Follow
      Hono's routing for custom and case-sensitive methods. It must work both when
      the routes come from a sub-app mounted with `app.route()` and when the
      middleware is installed in a sub-app (possibly with a `basePath`) that is then
      mounted into another app with `app.route()`.

  - id: cache-query
    pr: 5119
    solution: 3bc96ba9
    expected_tier: deep
    # v1 prompt left out the onCacheNotAvailable call and the already-read body case
    # that the PR's tests check; every config failed those tests. Corrected 2026-10-21.
    # Second correction the same day: the first one said any body read keeps caching
    # (the tests bypass after formData()), and the stored key format an existing test
    # now checks was not given. Every config failed those two tests again.
    prompt: |
      The cache middleware only caches GET. Add support for the HTTP QUERY method
      (a safe method with a request body). A QUERY cache key must depend on the
      method, a SHA-256 digest of the request body, the Content-Type,
      Content-Encoding, Content-Language and Content-Location headers, and the
      configured Vary values, so different bodies or content types never share an
      entry, and GET and QUERY never share one either (a GET URL must not be able to
      alias a QUERY key). Reading the body for the key must not consume it for the
      handler. A QUERY whose body an earlier middleware already read through
      `c.req.text()` (or another HonoRequest body method that keeps the raw bytes) is
      still cached, but one already read as FormData (`c.req.formData()`) bypasses
      caching, because multipart content can't be reserialized with a stable
      boundary. Every entry, GET included, is stored under the request origin's
      `/.hono/cache` URL with query parameters: `__hono_cache_key` (the key from
      `keyGenerator`, or the request URL, without any `#fragment`), then
      `__hono_cache_method` (`GET` or `QUERY`), then for QUERY the body digest, then
      the Vary values; e.g. a custom key `dynamic-cache-key` on
      `http://localhost/...` is stored as
      `http://localhost/.hono/cache?__hono_cache_key=dynamic-cache-key&__hono_cache_method=GET`. Add a
      `maxQueryBodySize` option (64 KiB by default): a body larger than the limit, or
      one that can't be read, bypasses caching, and a body at exactly the limit is
      cached. Without Web Crypto, QUERY requests bypass caching while GET keeps
      working, and the middleware calls the existing `onCacheNotAvailable` option once,
      when it is created. The callback now receives the reason as a string argument
      (when `caches` is missing, the message that is logged today), here `Cache Middleware cannot cache QUERY
      requests because Web Crypto is not available.` A custom cache key must not be
      resolved as a URL.

  # Hard set (added 2026-10-24): multi-module or long-reasoning PRs merged after
  # July, picked for a low solve rate of the `haiku` floor config.

  - id: regexp-wildcard-middleware
    pr: 5266
    solution: a10592f3e1864cbe277619633db953450a6b1e4b
    expected_tier: deep
    # The PR's new cases are in common.case.test.ts, which has no tests of its own:
    # every router's test file runs them. Copying it in and running those scores the task.
    test_files:
      - src/router/common.case.test.ts
      - src/router/linear-router/router.test.ts
      - src/router/pattern-router/router.test.ts
      - src/router/reg-exp-router/prepared-router.test.ts
      - src/router/reg-exp-router/router.test.ts
      - src/router/smart-router/router.test.ts
      - src/router/trie-router/router.test.ts
    prompt: |
      With the `RegExpRouter`, a wildcard route whose path has a parameter before
      the trailing `*` is not applied to the routes it covers. After
      `add('GET', '/:name/*', 'mw')` and `add('GET', '/:id', 'h')`, matching
      `GET /abc` should return both handlers, `mw` with params `{ name: 'abc' }`
      and `h` with `{ id: 'abc' }`; `GET /abc/sub` returns only `mw`.

      The same must work when the parameter has a pattern: `/:name{[a-z]+}/*`,
      patterns with nested braces such as `/posts/:year{[0-9]{4}}/*` together with
      `/posts/:yr{[0-9]{4}}/comments`, patterns with regexp meta characters such as
      `/files/:kind{(?:foo|bar)}/*`, and the explicit default pattern
      `/user/:userId{[^/]+}/*` together with `/user/:id/profile`. Each handler gets
      the parameter names of its own route. Handlers come back in registration
      order, whichever of the two was added first, and a wildcard registered for
      `ALL` applies to a `POST` route. A suffix wildcard without a slash also has
      to be associated: `/assets*` and `/assets/app.js` (both `POST`) both match
      `/assets/app.js`, in registration order, whichever comes first.

      The other routers already behave this way and must keep doing so.
      `LinearRouter` doesn't support these patterns; leave it as it is.

  - id: mount-middleware
    pr: 5221
    solution: ae595de8ae05ea548560da93140ee1d53e5a8202
    expected_tier: standard
    prompt: |
      Add a Mount Middleware that replaces `app.mount()`: `src/middleware/mount/index.ts`
      exporting `mount(applicationHandler, options?)`, which returns a middleware for
      serving an app built with another framework, e.g.
      `app.all('/itty/*', mount(ittyRouter.handle))`. Export it as `hono/mount` like
      the other middleware, and mark `app.mount()` as deprecated in favor of it.

      - The handler is called as `applicationHandler(request, ...args)`. By default
        `args` is `[c.env, executionCtx]`, with `executionCtx` undefined when the
        context has none (that must not throw). `options` may be a function
        `(c) => value` whose result becomes `args` (an array is spread, any other
        value is passed as the single argument), or an object
        `{ optionHandler?, replaceRequest? }` where `optionHandler` is that function.
      - By default the request handed over has the mount prefix stripped from its
        path. The prefix is the route path the middleware was registered on,
        without the trailing `/*`, including any `basePath()`: `/another-app/hello`
        becomes `/hello`, `/another-app` becomes `/`. Query string and headers are
        kept. Mounted on `/*`, the path is passed on unchanged. The prefix is
        matched against the decoded path (a route `/api/é/*` strips the prefix of
        `/api/%C3%A9/hello`, giving `/hello`), while the rest keeps its original
        encoding: `/api/v1/admin%2Fsecret` gives `/admin%2Fsecret`, and
        `/api/foo%252Fbar` under `/api/*` gives `/foo%252Fbar`.
      - `replaceRequest: (req) => Request` replaces that default;
        `replaceRequest: false` hands over the original request unchanged.
      - When the handler returns a response, that is the response, and outer
        middleware still runs on it. When it returns nothing, the middleware calls
        `next()`: with `app.use('/x/*', mount(h))` later routes handle the request,
        and with nothing else matching, the app's `notFound` handler answers.

# Batches: several independent bug reports in one prompt, on a commit where all
# of them are still present. Each part keeps its own PR's tests as the scorer.
# They exist to give delegation room to pay off: the parts touch different
# modules and can be fixed in parallel.
batches:
  - id: batch-aug
    base: a19462879716e7b600daed8eb3a1b2af4bd68feb   # parent of #5250, before all three fixes
    parts: [csrf-options, etag-ows, accepts-wildcard]
    expected_tier: standard
    intro: |
      Three independent bug reports came in for this repo. Fix all three.

  - id: batch-jul
    base: 9728702911073aec5a63a3ba2840b7240e5d3205   # parent of #5067, before all three fixes
    parts: [content-type-case, compress-206, secure-headers-csp]
    expected_tier: standard
    intro: |
      Three independent bug reports came in for this repo. Fix all three.

# Named task sets for `run --set` and `validate --set`.
sets:
  # v1: does routing beat "always Sonnet" and "Opus at high effort"? The hard
  # tasks are where a cheap model should fail and escalation has to earn its keep.
  v1:
    - compress-206          # mechanical
    - content-type-case     # standard
    - csrf-options          # security, small
    - jwt-bad-signature     # security, small
    - trie-suffix-wildcard  # hardest v0 task
    - regexp-router-unsupported
    - jsx-array
    - method-not-allowed
    # cache-query was dropped on the v1-results branch because its PR tests pin the
    # stored key format. Back in 2026-10-21: the prompt now states that format as part
    # of the spec, and with it Sonnet and the router solved the task.
    - cache-query
    - batch-aug
    - batch-jul

  # The tasks the `haiku` floor failed at least once in two runs (2026-10-24-floor):
  # where a cheap start has to escalate, and checks and reviews have to earn their keep.
  hard:
    - jsx-array                   # floor 0/2
    - regexp-wildcard-middleware  # floor 0/2
    - method-not-allowed          # floor 1/2
    - trie-suffix-wildcard        # floor 1/2

  # Every task, for the final run: v1 plus the v0 single fixes outside the batches'
  # prompts and the two tasks added on 2026-10-24.
  all:
    - compress-206
    - content-type-case
    - csrf-options
    - jwt-bad-signature
    - etag-ows
    - accepts-case
    - secure-headers-csp
    - accepts-wildcard
    - etag-stream-digest
    - trie-suffix-wildcard
    - regexp-router-unsupported
    - jsx-array
    - method-not-allowed
    - cache-query
    - regexp-wildcard-middleware
    - mount-middleware
    - batch-aug
    - batch-jul
