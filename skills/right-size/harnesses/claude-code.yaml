# Tier -> Claude Code configuration.
# Verified against official docs on 2026-10-17:
#   https://code.claude.com/docs/en/sub-agents
#   https://code.claude.com/docs/en/skills
# Model choices are initial and unbenchmarked.

harness: claude-code
verified: 2026-10-17   # aliases checked live with `claude -p --output-format json`: haiku -> claude-haiku-5-5

tiers:
  inline:
    apply: Do the work in the main session.
    effort: session
  scout:
    model: haiku
    effort: low
    agent: right-size-scout
    tools: read-only
  mechanical:
    model: haiku
    effort: low
    agent: right-size-mechanical
  standard:
    model: sonnet
    effort: medium
    agent: right-size-standard
  deep:
    model: opus
    effort: medium   # measured 2026-10-18: medium solved every risk-floor task; high is the escalation step
    agent: right-size-deep

# Past deep: only after deep failed, and only with the user's confirmation.
beyond_deep:
  model: fable
  effort: xhigh

how_to_apply:
  - If the right-size-* agents exist (created by right-size-setup), delegate to them; they carry both model and effort.
  - Otherwise, pass the tier's model as the Agent tool's per-invocation model parameter (it overrides agent frontmatter) and delegate to a general-purpose or Explore agent. Effort then follows the session.
  - For inline work on a fresh session (little context so far), suggest /model and /effort for the tier; the user runs them. Later in a session suggest /effort only, since on Opus, Sonnet and Haiku 5.5 and Fable 5.1 (API key or subscription) it keeps the prompt cache, while a model switch re-reads the whole conversation uncached.
  - Router mode (scripts/route.py) uses these same tier entries for the whole session, and the scout entry for its classifier call.

# List prices in USD per million tokens, used by right-size-audit to price transcripts.
# Source: Anthropic's model table (claude-api skill, cached 2026-10-06). Cache writes
# cost 1.25x input with the 5-minute TTL and 2x with the 1-hour TTL; reads as listed.
# Haiku 5.5's input price doubles above 100K prompt tokens; the audit ignores that.
prices:
  claude-fable-5-1:
    input: 10
    output: 50
    cache_read: 0.25
  claude-opus-5-5:
    input: 4
    output: 20
    cache_read: 0.20
  claude-sonnet-5-5:
    input: 2
    output: 10
    cache_read: 0.20
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
  # Older models still found in transcripts (cache reads at the usual 0.1x input).
  claude-haiku-4-5:
    input: 1
    output: 5
    cache_read: 0.10

notes:
  - The haiku alias resolves to Claude Haiku 5.5 (1M context, accepts effort) as of 2026-10-17. On older Claude Code versions it may still be Haiku 4.5, which has a 200K window and no effort setting.
  - Fable needs usage credits on subscription plans; if beyond_deep fails with a credits error, stay on opus at max effort.
  - Family aliases (opus, sonnet) resolve to the main session's exact model when it is in the same family.
  - CLAUDE_CODE_SUBAGENT_MODEL ranks below frontmatter since v2.1.251; CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1 overrides it. If either is set, tell the user the tier may not be honored.
  - A skill's model frontmatter did not switch the main session's model in Claude Code 2.1.302 (headless or interactive; the transcript stayed on the session model), so right-size never relies on it. Re-test before using it.
  - The built-in Explore agent runs on the main model (on opus in Fable sessions), so a scout via Explore without a model parameter is not cheap.
