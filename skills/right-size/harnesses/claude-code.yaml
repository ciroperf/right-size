# Tier -> Claude Code configuration.
# Verified against official docs on 2026-10-17:
#   https://code.claude.com/docs/en/sub-agents
#   https://code.claude.com/docs/en/skills
# Model choices are initial and unbenchmarked.

harness: claude-code
verified: 2026-10-17

tiers:
  inline:
    apply: Do the work in the main session.
    effort: session
  scout:
    model: haiku
    effort: null          # Haiku 4.5 does not support effort
    agent: right-size-scout
    tools: read-only
  mechanical:
    model: haiku
    effort: null
    agent: right-size-mechanical
  standard:
    model: sonnet
    effort: medium
    agent: right-size-standard
  deep:
    model: opus
    effort: high
    agent: right-size-deep

# Past deep: only after deep failed, and only with the user's confirmation.
beyond_deep:
  model: fable
  effort: xhigh

how_to_apply:
  - If the right-size-* agents exist (created by right-size-setup), delegate to them; they carry both model and effort.
  - Otherwise, pass the tier's model as the Agent tool's per-invocation model parameter (it overrides agent frontmatter) and delegate to a general-purpose or Explore agent. Effort then follows the session.
  - For inline work, suggest /effort only when the remaining work is substantial. Changing effort or model mid-conversation can invalidate the prompt cache, which may cost more than it saves.

notes:
  - Haiku 4.5 has a 200K context window. If a scout or mechanical task must read more than ~150K tokens, use sonnet instead.
  - Family aliases (opus, sonnet) resolve to the main session's exact model when it is in the same family.
  - CLAUDE_CODE_SUBAGENT_MODEL ranks below frontmatter since v2.1.251; CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1 overrides it. If either is set, tell the user the tier may not be honored.
  - The built-in Explore agent runs on the main model (on opus in Fable sessions), so a scout via Explore without a model parameter is not cheap.
