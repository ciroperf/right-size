# Tier -> GitHub Copilot configuration. Advice only: right-size-setup doesn't
# generate Copilot agents yet, and no smoke test has checked that a custom
# agent runs on the configured model.
# Verified against official docs on 2026-10-18:
#   https://docs.github.com/en/copilot/reference/custom-agents-configuration
#   https://docs.github.com/en/copilot/reference/ai-models/supported-models
# Model choices are initial and unbenchmarked. Availability depends on plan and org policy.

harness: copilot
verified: 2026-10-18

tiers:
  inline:
    apply: Do the work in the main session.
    effort: session
  scout:
    model: Claude Haiku 5.5
    effort: low
    tools: read-only
  mechanical:
    model: Claude Haiku 5.5
    effort: low
  standard:
    model: Claude Sonnet 5.5
    effort: medium
  deep:
    model: Claude Opus 5.5
    effort: high

beyond_deep:
  model: Claude Fable 5.1
  effort: high

how_to_apply:
  - Custom agents are .agent.md files with YAML frontmatter; repository agents live in .github/agents/. The model property is a string; when unset the agent inherits the default model.
  - The custom agent configuration reference documents no reasoning effort property, so effort is text-only advice.
  - For inline work, tell the user which model to pick in the Copilot model picker.

notes:
  - Model names above are the display names from the supported-models list. The docs don't state the exact string the model property expects, so check it in the agent picker before relying on it.
  - Claude Fable 5 and 5.1 must be enabled by an administrator.
